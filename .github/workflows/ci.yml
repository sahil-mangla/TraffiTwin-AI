name: TraffiTwin CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traffitwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/traffitwin_test
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Pull Git LFS objects (model weights)
      run: git lfs pull

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # requirements.txt / requirements-dev.txt are pip-compile-generated
        # lockfiles (exact pins) — see requirements.in / requirements-dev.in
        # for the source of truth and how to regenerate them.
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors, undefined names,
        # or other pyflakes correctness issues (mirrors the old flake8
        # --select=E9,F63,F7,F82 blocking pass, minus E9 — ruff always
        # errors on unparseable files regardless of rule selection).
        ruff check . --select=F63,F7,F82 --output-format=full
        # exit-zero treats the full style/complexity ruleset (configured in
        # pyproject.toml) as warnings only, same two-tier pattern as before.
        ruff check . --exit-zero --statistics

    - name: Static type check with mypy
      # The pre-existing ~60-error backlog has been paid down to zero —
      # blocking now so new type errors can't be introduced silently.
      run: |
        mypy backend --ignore-missing-imports

    - name: Scan Python dependencies for known vulnerabilities
      # PYSEC-2026-1325 (ecdsa, transitive via python-jose) is a P-256
      # timing side-channel in ecdsa.SigningKey.sign_digest(); upstream
      # considers side-channel attacks out of scope and has no planned fix.
      # We only use python-jose for HS256 (HMAC) signing (backend/auth/jwt_utils.py),
      # so the affected ECDSA code path is never exercised — safe to ignore.
      run: |
        pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

    - name: Apply database migrations
      # Runs the actual migration file against the ephemeral CI Postgres —
      # both provisions the schema for the test run and validates the
      # migration itself applies cleanly on every PR.
      run: |
        alembic upgrade head

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=backend --cov-report=xml --cov-report=term --cov-fail-under=85

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
        retention-days: 14

    - name: Generate coverage badge
      run: |
        mkdir -p .github/badges
        genbadge coverage -i coverage.xml -o .github/badges/coverage.svg

    - name: Commit coverage badge
      # Self-hosted badge (no third-party coverage service/account needed) —
      # only commit on a direct push to main, never from a PR run, since PR
      # runs can't push and the badge should only reflect main's state.
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        if ! git diff --quiet -- .github/badges/coverage.svg; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git commit -m "Update coverage badge [skip ci]"
          git push
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint Frontend
      run: |
        cd frontend
        npm run lint

    - name: Run Frontend tests
      run: |
        cd frontend
        npm run test

    - name: Install Playwright browsers
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    - name: Run end-to-end tests
      run: |
        cd frontend
        npm run test:e2e
      env:
        CI: true

    - name: Scan Frontend dependencies for known vulnerabilities
      run: |
        cd frontend
        npm audit --audit-level=high

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Upload Frontend Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist
        retention-days: 1

  deploy:
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Download Frontend Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist

    - name: Pull Git LFS objects
      run: git lfs pull

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Run database migrations
      # Explicit, visible pipeline step — deliberately NOT run inside the
      # app's startup/lifespan, so a schema change is always an auditable
      # CI log entry, not implicit app-boot magic. Must run before the app
      # deploy steps below so new code never runs against an unmigrated
      # schema. Requires a DATABASE_URL secret pointing at the production
      # database — see docs/SECRETS.md.
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        pip install -r requirements.txt -r requirements-dev.txt
        alembic upgrade head

    # Backend Deployment to Hugging Face Spaces
    - name: Deploy Backend to Hugging Face Spaces
      env:
        HF_USERNAME: ${{ secrets.HF_USERNAME }}
        HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ] || [ -z "$HF_SPACE_NAME" ]; then
          echo "Hugging Face secrets not configured. Skipping backend deploy."
        else
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          # Push to HF Space
          git remote add hf https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME
          git push -f hf main
        fi

    # Frontend Deployment to Firebase Hosting
    - name: Deploy Frontend to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: ${{ secrets.GITHUB_TOKEN }}
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        projectId: traffitwin-ai
        channelId: live
        entryPoint: frontend
      env:
        FIREBASE_CLI_PREV: 1
